<header [class]="classes.join(' ')">
  <img class="mt-brand" src="assets/mytravel/tourism-malaysia-logo.png" [alt]="brandLogoAlt">
  <div class="mt-wordmark" aria-hidden="true">MyTravel</div>
  <div class="mt-top-actions">
    <button *ngIf="showLanguageToggle" class="mt-language" type="button" [attr.aria-label]="languageToggleAriaLabel" (click)="toggleLanguage()">
      <span aria-hidden="true" [class.selected]="language === 'BM'">BM</span>
      <strong aria-hidden="true" [class.selected]="language === 'EN'">EN</strong>
    </button>
    <button *ngIf="showNotification" class="mt-icon-button" type="button" [attr.aria-label]="notificationsAriaLabel" (click)="openNotifications()">
      <ion-icon name="notifications-outline" aria-hidden="true"></ion-icon>
      <i *ngIf="notificationCount > 0" class="topbar-notice-dot" aria-hidden="true">{{ notificationBadgeLabel }}</i>
    </button>
  </div>
</header>
