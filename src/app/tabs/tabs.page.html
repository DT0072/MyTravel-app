<ion-tabs>
  <ion-tab-bar slot="bottom" [attr.aria-label]="t(copy.tabBarAria)" [class.tab-bar-hovered]="isHovered"
               (mouseenter)="isHovered = true"
               (mouseleave)="isHovered = false">

    <ion-tab-button tab="tab1" href="/tabs/tab1" [attr.aria-label]="tabAriaLabel('explore')">
      <ion-icon aria-hidden="true" name="compass-outline"></ion-icon>
      <ion-label>{{ t(copy.explore) }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab2" href="/tabs/tab2" [attr.aria-label]="tabAriaLabel('navigate')">
      <ion-icon aria-hidden="true" name="train-outline"></ion-icon>
      <ion-label>{{ t(copy.navigate) }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab3" href="/tabs/tab3" [attr.aria-label]="tabAriaLabel('community')">
      <ion-icon aria-hidden="true" name="people-outline"></ion-icon>
      <ion-label>{{ t(copy.community) }}</ion-label>
    </ion-tab-button>

    <ion-tab-button tab="tab4" href="/tabs/tab4" [attr.aria-label]="tabAriaLabel('profile')">
      <ion-icon aria-hidden="true" name="person-outline"></ion-icon>
      <ion-label>{{ t(copy.profile) }}</ion-label>
    </ion-tab-button>

  </ion-tab-bar>

</ion-tabs>
